# Alembic Configuration for AndhaKaanun
# Run from project root: alembic -c apps/api/db/alembic.ini upgrade head

[alembic]
# Path to migration scripts (relative to this .ini file)
script_location = migrations

# Template for new migration filenames
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Prepend sys.path — project root for module imports
prepend_sys_path = ../../..

# Target metadata — set in env.py
# sqlalchemy.url is set dynamically from environment

[post_write_hooks]
# Ruff formatting for generated migrations
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
