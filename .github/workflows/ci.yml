name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
        
    - name: Run Ruff (Lint & Format Check)
      run: |
        ruff check .
        ruff format --check .
        
    - name: Run mypy (Type Check)
      run: |
        mypy .
        
    - name: Run pytest
      run: |
        pytest
        
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
        
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
        
    - name: Build Next.js App
      run: |
        cd apps/web
        npm run build

  build-docker-images:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Backend Image
      run: docker build -t andhakaanun-api -f apps/api/Dockerfile .
      
    - name: Build Frontend Image
      run: docker build -t andhakaanun-web -f apps/web/Dockerfile .
