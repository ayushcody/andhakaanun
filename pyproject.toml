[project]
name = "andhakaanun"
version = "2.0.0"
description = "AI-powered legal analysis engine for Indian law"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AndhaKaanun Team" }]

[project.scripts]
api = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

# ── Backend Dependencies ──────────────────────
[project.dependencies]
# Core
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
pydantic = ">=2.9.0"
pydantic-settings = ">=2.6.0"

# Database
sqlalchemy = { version = ">=2.0.35", extras = ["asyncio"] }
asyncpg = ">=0.30.0"
alembic = ">=1.14.0"
greenlet = ">=3.1.0"

# AI / ML
google-generativeai = ">=0.8.0"
pinecone-client = ">=5.0.0"
sentence-transformers = ">=3.3.0"

# Caching
redis = { version = ">=5.2.0", extras = ["hiredis"] }

# NLP
spacy = ">=3.8.0"

# Utilities
httpx = ">=0.28.0"
python-dotenv = ">=1.0.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["apps", "packages"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
