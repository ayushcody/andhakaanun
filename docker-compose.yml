# docker compose up --build
# Reads API settings from .env (copy .env.example first). Without PostgreSQL,
# Redis or a Pinecone index the API runs in its degraded mode.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional services. Uncomment, then point DATABASE_URL / REDIS_URL in .env at
  # postgresql+asyncpg://postgres:password@db:5432/andhakaanun and redis://redis:6379/0.
  #
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: andhakaanun
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
