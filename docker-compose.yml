version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Add other DB/Redis connection strings here when available
      # - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/andhakaanun
      # - REDIS_URL=redis://redis:6379/0
    depends_on:
      # - db
      # - redis
      pass

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  # db:
